<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 브라우저 자동 다크 반전 차단(삼성 인터넷·안드로이드 크롬 Force Dark). 검수 화면은 색이 그대로여야 한다. -->
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" id="themeColor" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="중고폰 매입 검수용 단색·터치·사운드·진동·마이크 화면">
<title>예스통신 액정 검수</title>
<style>
  :root{
    color-scheme: light only;
    --bg:#FFFFFF;
    --ui-fg:#ffffff;
    --ui-bg:rgba(0,0,0,.42);
    --ui-line:rgba(255,255,255,.42);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    color-scheme: light only;
    background:var(--bg);
    background-color:var(--bg);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-text-size-adjust:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  }
  #stage{
    position:fixed; left:0; top:0;
    width:100%; height:100vh; height:100dvh;
    color-scheme: light only;
    background:var(--bg);
    background-color:var(--bg);
    touch-action:none;
    overflow:hidden;
  }

  /* 단색 검수 배경은 CSS 배경색 대신 이 캔버스에 직접 채운다.
     삼성 인터넷의 '웹 콘텐츠에 어두운 화면 모드 강제 적용'이 CSS 배경색까지 반전시키기 때문. */
  #colorCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    pointer-events:none;
    z-index:1;
  }

  /* ---------- 안내 문구 ---------- */
  #hint{
    position:absolute;
    left:0; right:0;
    top:calc(env(safe-area-inset-top, 0px) + 16px);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    pointer-events:none;
    opacity:0;
    transition:opacity .45s ease;
    z-index:5;
  }
  #hint .pill{
    background:var(--ui-bg); color:var(--ui-fg);
    border:1px solid var(--ui-line);
    border-radius:999px;
    padding:9px 18px;
    font-size:15px; font-weight:600;
    letter-spacing:-.2px;
    line-height:1.25;
    max-width:88vw;
    text-align:center;
    word-break:keep-all;
  }
  #hint .sub{
    font-size:12.5px; font-weight:500;
    color:var(--ui-fg); opacity:.72;
    letter-spacing:-.1px;
    text-align:center;
  }
  #dots{display:flex; gap:5px; margin-top:2px;}
  #dots i{
    width:5px; height:5px; border-radius:50%;
    background:var(--ui-fg); opacity:.35; display:block;
  }
  #dots i.on{opacity:.95;}

  /* ---------- 메뉴 버튼 ---------- */
  #menuBtn{
    position:fixed;
    right:calc(env(safe-area-inset-right, 0px) + 10px);
    top:calc(env(safe-area-inset-top, 0px) + 10px);
    z-index:20;
    appearance:none;
    font:600 12px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    letter-spacing:.2px;
    color:#fff;
    background:rgba(0,0,0,.30);
    border:1px solid rgba(255,255,255,.45);
    border-radius:999px;
    padding:9px 13px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    opacity:.92;
    transition:opacity .4s ease;
  }
  #menuBtn:active{opacity:.6;}
  /* 단색 검수 중 힌트가 사라지면 메뉴 버튼을 더 옅게 (잔상·가장자리 확인 방해 최소화) */
  body:not(.hint-visible):not(.panel-open):not(.touch-mode):not(.hw-mode) #menuBtn{opacity:.22;}
  /* 사운드·진동·마이크 화면은 어두운 카드가 화면을 덮으므로 메뉴 버튼을 또렷하게 */
  body.hw-mode #menuBtn{opacity:.86; background:rgba(0,0,0,.5);}

  /* ---------- 터치 테스트 ---------- */
  #touchLayer{
    position:absolute; inset:0;
    display:none;
    background:#0B0B0B;
    z-index:3;
  }
  #touchLayer.on{display:block;}
  #touchLayer canvas{
    position:absolute; left:0; top:0; display:block;
    touch-action:none;
  }
  /* 터치 모드 하단 컨트롤: 화면 네 모서리를 비워 두려고 가운데에 모음 */
  #touchBar{
    position:absolute;
    left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 12px);
    z-index:6;
    display:none;
    align-items:center; gap:7px;
    pointer-events:none;
    max-width:94vw;
  }
  #touchBar.on{display:flex;}
  #badge{
    background:rgba(0,0,0,.55);
    color:#eaffea;
    border:1px solid rgba(255,255,255,.28);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px; font-weight:600;
    letter-spacing:-.1px;
    white-space:nowrap;
  }
  #badge.done{
    background:rgba(0,255,60,.92);
    color:#04140a;
    border-color:rgba(255,255,255,.6);
  }
  #resetBtn{
    appearance:none;
    pointer-events:auto;
    font:600 13px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:#fff;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.42);
    border-radius:999px;
    padding:11px 16px;
    white-space:nowrap;
  }
  #resetBtn:active{background:rgba(255,255,255,.3);}

  /* 터치 모드에서는 메뉴 버튼을 상단 가운데로 옮겨 네 모서리를 비움 */
  body.touch-mode #menuBtn{
    right:auto;
    left:50%;
    transform:translateX(-50%);
    opacity:.55;
  }

  /* ---------- 선택 패널 ---------- */
  #panel{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:30;
    background:rgba(14,14,16,.93);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top-left-radius:20px; border-top-right-radius:20px;
    border-top:1px solid rgba(255,255,255,.14);
    padding:10px 14px calc(env(safe-area-inset-bottom, 0px) + 16px);
    transform:translateY(112%);
    transition:transform .28s cubic-bezier(.22,.8,.28,1);
    color:#fff;
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
  }
  #panel.on{transform:translateY(0);}
  #panel .grip{
    width:40px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.28);
    margin:2px auto 12px;
  }
  #panel .ttl{
    font-size:11.5px; font-weight:600; letter-spacing:.4px;
    color:rgba(255,255,255,.55);
    margin:0 2px 9px;
  }
  #chips{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .chip{
    display:flex; align-items:center; gap:9px;
    appearance:none; text-align:left;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;
    padding:10px 11px;
    color:#fff;
    font:600 14px/1.2 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    letter-spacing:-.2px;
  }
  .chip .sw{
    width:20px; height:20px; border-radius:6px; flex:none;
    border:1px solid rgba(255,255,255,.42);
    background-size:100% 100%;
  }
  .chip .tx{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .chip .tx small{
    font-size:10.5px; font-weight:500; color:rgba(255,255,255,.5);
    letter-spacing:-.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chip.on{
    background:rgba(255,255,255,.93); color:#0b0b0c;
    border-color:rgba(255,255,255,.93);
  }
  .chip.on .tx small{color:rgba(0,0,0,.45);}
  #panelTools{
    display:flex; justify-content:flex-end; margin-top:10px;
  }
  #fsBtn{
    appearance:none;
    font:600 12.5px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    letter-spacing:-.1px;
    color:rgba(255,255,255,.92);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.24);
    border-radius:999px;
    padding:9px 14px;
  }
  #fsBtn:active{background:rgba(255,255,255,.22);}
  #panel .foot{
    display:flex; gap:8px; margin-top:10px;
  }
  #panel .foot button{
    flex:1;
    appearance:none;
    font:600 13.5px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:#fff; background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16);
    border-radius:12px; padding:13px 6px;
  }
  #panel .foot button:active{background:rgba(255,255,255,.22);}
  #closeBtn{flex:0 0 74px !important;}
  #panel .tip{
    margin:9px 2px 0;
    font-size:11px; font-weight:500; line-height:1.55;
    color:rgba(255,255,255,.52);
    letter-spacing:-.1px;
    word-break:keep-all;
  }
  #panel .tip b{color:rgba(255,255,255,.8); font-weight:600;}
  @media (max-height:560px){
    .chip{padding:8px 10px; font-size:13px;}
    .chip .tx small{display:none;}
    #panel .foot button{padding:10px 6px;}
    #panelTools{margin-top:8px;}
    #fsBtn{padding:7px 12px;}
  }
  /* 9개 항목: 마지막(사운드·진동·마이크) 칩은 한 줄 전체로 */
  #chips .chip:last-child:nth-child(odd){grid-column:1 / -1;}

  /* ---------- 사운드 · 진동 · 마이크 ---------- */
  #hwLayer{
    position:absolute; inset:0;
    display:none;
    z-index:4;
    background:radial-gradient(120% 80% at 50% 0%, #171A1F 0%, #0B0B0B 64%);
    color:#fff;
    padding:calc(env(safe-area-inset-top, 0px) + 54px) 14px calc(env(safe-area-inset-bottom, 0px) + 16px);
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  #hwLayer.on{display:flex; flex-direction:column;}
  .hwCard{
    width:100%; max-width:430px; margin:auto;
    display:flex; flex-direction:column; gap:12px;
  }
  .hwHead{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:0 3px 1px;}
  .hwHead h1{margin:0; font-size:18px; font-weight:700; letter-spacing:-.5px;}
  .hwHead span{font-size:10.5px; font-weight:500; color:rgba(255,255,255,.42); letter-spacing:-.1px; white-space:nowrap;}
  .hwSec{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);
    border-radius:16px;
    padding:11px 12px 12px;
  }
  .hwSec .hd{display:flex; align-items:center; gap:7px; margin-bottom:9px;}
  .hwSec .hd b{font-size:13px; font-weight:700; letter-spacing:-.2px;}
  .hwSec .hd em{
    font-style:normal; margin-left:auto;
    font-size:10.5px; font-weight:500; letter-spacing:-.1px;
    color:rgba(255,255,255,.42); white-space:nowrap;
  }
  .hwRow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px;}
  .hwBtn{
    appearance:none; -webkit-appearance:none;
    font-family:inherit; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    min-height:52px; padding:9px 6px;
    background:rgba(255,255,255,.085);
    border:1px solid rgba(255,255,255,.15);
    border-radius:13px;
    font-size:13.5px; font-weight:700; letter-spacing:-.3px; line-height:1.2;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .hwBtn small{font-size:10px; font-weight:500; color:rgba(255,255,255,.46); letter-spacing:-.1px; line-height:1.2;}
  .hwBtn:active{transform:scale(.985);}
  .hwBtn.on{background:#35E07C; color:#062312; border-color:#35E07C;}
  .hwBtn.on small{color:rgba(0,0,0,.5);}
  .hwBtn.wide{width:100%; min-height:50px;}
  #micMeter{
    position:relative; height:11px; margin-top:10px;
    background:rgba(255,255,255,.14); border-radius:999px; overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
  }
  #meterFill{
    display:block; height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,#35E07C 0%,#35E07C 62%,#FFD34E 84%,#FF5C5C 100%);
    transition:width .08s linear;
  }
  .hwSt{
    margin:8px 2px 0;
    font-size:11.5px; font-weight:500; line-height:1.45; letter-spacing:-.1px;
    color:rgba(255,255,255,.52); word-break:keep-all;
    min-height:17px;
  }
  .hwSt.warn{color:#FFB1A4;}
  .hwMeta{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  #micDb{
    flex:none; margin-top:8px;
    font-size:11px; font-weight:600; letter-spacing:-.1px;
    color:rgba(255,255,255,.42); font-variant-numeric:tabular-nums;
  }
  @media (max-height:700px){
    .hwCard{gap:10px;}
    .hwSec{padding:9px 11px 10px;}
    .hwBtn{min-height:46px; font-size:12.5px;}
    .hwHead h1{font-size:16.5px;}
    .hwSt{font-size:11px; min-height:15px; margin-top:6px;}
  }
  @media (max-height:580px){
    #hwLayer{padding-top:calc(env(safe-area-inset-top, 0px) + 46px);}
    .hwHead{display:none;}
    .hwBtn small{display:none;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="colorCanvas" aria-hidden="true"></canvas>

  <div id="touchLayer">
    <canvas id="grid"></canvas>
    <canvas id="fills"></canvas>
    <canvas id="paths"></canvas>
  </div>

  <div id="hwLayer">
    <div class="hwCard">
      <div class="hwHead">
        <h1>사운드 · 진동 · 마이크</h1>
        <span>매입 검수 9단계</span>
      </div>

      <section class="hwSec">
        <div class="hd"><b>스피커</b><em>상단 = L / 하단 = R</em></div>
        <div class="hwRow">
          <button class="hwBtn" type="button" data-pan="-1"><span>상단(좌)</span><small>L 채널</small></button>
          <button class="hwBtn" type="button" data-pan="1"><span>하단(우)</span><small>R 채널</small></button>
          <button class="hwBtn" type="button" data-pan="0"><span>양쪽</span><small>스테레오</small></button>
        </div>
        <p class="hwSt" id="spkStatus">버튼을 누르면 3음이 약 1.2초 재생됩니다</p>
      </section>

      <section class="hwSec">
        <div class="hd"><b>진동</b><em>갤럭시 전용</em></div>
        <button class="hwBtn wide" id="vibBtn" type="button"><span>진동 울리기 (갤럭시)</span><small>220 · 100 · 220 · 100 · 300ms</small></button>
        <p class="hwSt" id="vibStatus">갤럭시: 세 번 울립니다</p>
      </section>

      <section class="hwSec">
        <div class="hd"><b>마이크</b><em>3초 녹음 → 자동 재생</em></div>
        <button class="hwBtn wide" id="micBtn" type="button"><span id="micBtnLabel">마이크 3초 녹음·재생</span><small id="micBtnSub">눌러서 권한 허용</small></button>
        <div id="micMeter"><span id="meterFill"></span></div>
        <div class="hwMeta">
          <p class="hwSt" id="micStatus">레벨 바가 움직이면 마이크 정상</p>
          <span id="micDb">—</span>
        </div>
      </section>
    </div>
  </div>

  <div id="hint">
    <div class="pill" id="hintMain"></div>
    <div class="sub" id="hintSub"></div>
    <div id="dots"></div>
  </div>

  <div id="touchBar">
    <div id="badge">터치 0 / 0 칸</div>
    <button id="resetBtn" type="button">초기화</button>
  </div>
</div>

<button id="menuBtn" type="button" aria-label="검수 항목 메뉴">메뉴</button>

<div id="panel" role="dialog" aria-label="검수 항목 선택">
  <div class="grip"></div>
  <p class="ttl">검수 항목</p>
  <div id="chips"></div>
  <div id="panelTools">
    <button id="fsBtn" type="button">전체화면</button>
  </div>
  <p class="tip" id="browserTip" hidden></p>
  <div class="foot">
    <button id="prevBtn" type="button">‹ 이전</button>
    <button id="resetBtn2" type="button" hidden>초기화</button>
    <button id="closeBtn" type="button">닫기</button>
    <button id="nextBtn" type="button">다음 ›</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STEPS = [
    {label:"순백색 흰색", color:"#FFFFFF", note:"가장 밝은 화면 · 잔상·황변"},
    {label:"10% 회색",  color:"#1A1A1A", note:"약한 잔상·번인"},
    {label:"파란색",    color:"#0000FF", note:"블루 소자 잔상"},
    {label:"빨간색",    color:"#FF0000", note:"적색 얼룩"},
    {label:"초록색",    color:"#00FF00", note:"녹색 얼룩"},
    {label:"50% 회색",  color:"#808080", note:"중간 밝기 얼룩"},
    {label:"검정색",    color:"#000000", note:"휘점·빛샘"},
    {label:"터치 테스트", color:null,     note:"격자 전체 문지르기"},
    {label:"사운드·진동·마이크", color:null, note:"스피커 L/R · 진동 · 마이크"}
  ];
  var TOUCH_IDX = 7;   /* 터치 테스트 */
  var HW_IDX = 8;      /* 사운드·진동·마이크 */

  var stage = document.getElementById("stage");
  var hint = document.getElementById("hint");
  var hintMain = document.getElementById("hintMain");
  var hintSub = document.getElementById("hintSub");
  var dots = document.getElementById("dots");
  var themeColor = document.getElementById("themeColor");
  var menuBtn = document.getElementById("menuBtn");
  var panel = document.getElementById("panel");
  var chips = document.getElementById("chips");
  var closeBtn = document.getElementById("closeBtn");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var resetBtn2 = document.getElementById("resetBtn2");
  var touchLayer = document.getElementById("touchLayer");
  var badge = document.getElementById("badge");
  var resetBtn = document.getElementById("resetBtn");
  var touchBar = document.getElementById("touchBar");
  var fsBtn = document.getElementById("fsBtn");
  var colorCanvas = document.getElementById("colorCanvas");
  var cctx = colorCanvas ? colorCanvas.getContext("2d") : null;

  var idx = 0;
  var panelOpen = false;
  var hintTimer = null;

  /* ---------------- 색 대비 계산 ---------------- */
  function isLight(hex){
    var r = parseInt(hex.substr(1,2),16),
        g = parseInt(hex.substr(3,2),16),
        b = parseInt(hex.substr(5,2),16);
    return (0.2126*r + 0.7152*g + 0.0722*b) > 150;
  }

  function paintUI(){
    var step = STEPS[idx];
    var light = (step.color === null) ? false : isLight(step.color);
    if (light){
      hint.style.setProperty("--ui-fg", "#111114");
      hint.style.setProperty("--ui-bg", "rgba(255,255,255,.72)");
      hint.style.setProperty("--ui-line", "rgba(0,0,0,.16)");
    } else {
      hint.style.setProperty("--ui-fg", "#ffffff");
      hint.style.setProperty("--ui-bg", "rgba(0,0,0,.42)");
      hint.style.setProperty("--ui-line", "rgba(255,255,255,.42)");
    }
  }

  /* ---------------- 안내 문구 ---------------- */
  function setHintVisible(v){
    hint.style.opacity = v ? "1" : "0";
    document.body.classList.toggle("hint-visible", !!v);
  }

  function showHint(main, sub, ms){
    hintMain.textContent = main;
    hintSub.textContent = sub || "";
    hintSub.style.display = sub ? "" : "none";
    setHintVisible(true);
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ setHintVisible(false); }, ms || 2000);
  }

      main: STEPS[idx].label + " · " + STEPS[idx].note,
      sub: (idx === 0 ? "화면 밝기 최대 · 탭하면 다음 · 길게 누르면 메뉴" : "탭하면 다음 · 길게 누르면 메뉴"),

    var html = "";

  }

  /* ---------------- 단색 배경 캔버스 ----------------
     브라우저(특히 삼성 인터넷)가 color-scheme: light only를 무시하고 CSS 배경색을

      colorCanvas.height = ph;

    cctx.fillRect(0, 0, vw, vh);

      var sm = document.createElement("small");

  function syncChips(){

  function openPanel(){
    panelOpen = true;

  function closePanel(){

  function togglePanel(){

  }

  menuBtn.addEventListener("click", function(e){ e.stopPropagation(); togglePanel(); });
  closeBtn.addEventListener("click", function(e){ e.stopPropagation(); closePanel(); });
  prevBtn.addEventListener("click", function(e){ e.stopPropagation(); prev(); });
  nextBtn.addEventListener("click", function(e){ e.stopPropagation(); next(); });
  resetBtn2.addEventListener("click", function(e){ e.stopPropagation(); resetTouch(); closePanel(); });

  /* ---------------- 전체화면 ---------------- */
  /* 브라우저는 페이지 로드 직후의 자동 requestFullscreen()을 막는다.
     그래서 첫 탭은 "색을 넘기지 않고" 지금 색 그대로 전체화면으로 들어가는 데만 쓴다.
     requestFullscreen이 없는 브라우저(아이폰 사파리 등)나 거절된 경우에는 바로 다음 색으로 넘어간다. */
  var fsTrying = false;       /* 요청 진행 중 */
  var fsBlocked = false;      /* API 없음/거절 → 다음 탭부터는 바로 진행 */
  var fsFirstTapDone = false; /* 첫 탭에서 전체화면을 시도했는지 */

    var el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen);
  }

  function enterFullscreen(){
    if (fsElement()) return Promise.resolve(true);
    if (fsTrying) return Promise.resolve(null);
    if (!fsAvailable()){ fsBlocked = true; return Promise.resolve(false); }

    var el = document.documentElement, p;

    })["catch"](function(){

  var down = null, longTimer = null, tapInfo = null, panelDismissAt = 0;

  function handleTap(){

  /* ---------------- 터치 테스트 ---------------- */
  var gridC = document.getElementById("grid");
  var fillC = document.getElementById("fills");
  var pathC = document.getElementById("paths");
  var gctx = gridC.getContext("2d");
  var fctx = fillC.getContext("2d");
  var pctx = pathC.getContext("2d");

    COLS = W < 360 ? 4 : 5;
    CW = W / COLS;
    ROWS = Math.max(3, Math.round(H / CW));
    CH = H / ROWS;

      c.width = Math.round(W * DPR);
      c.height = Math.round(H * DPR);

      c.style.height = H + "px";

    gctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    gctx.fillRect(0, 0, W, H);

    gctx.beginPath();
    for (i = 1; i < COLS; i++){
      var x = Math.round(i * CW) + 0.5;
      gctx.moveTo(x, 0); gctx.lineTo(x, H);
    }
    for (i = 1; i < ROWS; i++){
      var y = Math.round(i * CH) + 0.5;
      gctx.moveTo(0, y); gctx.lineTo(W, y);
    }
    gctx.stroke();

    gctx.strokeStyle = "rgba(255,255,255,.5)";
    gctx.lineWidth = 1.5;

    gctx.strokeStyle = "rgba(140,255,140,.85)";
    gctx.lineWidth = 3;
    var L = Math.min(26, CW * 0.4);
    [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(function(c){
      gctx.beginPath();
      gctx.moveTo(c[0] + c[2]*L, c[1] + c[3]*1.5);
      gctx.lineTo(c[0] + c[2]*1.5, c[1] + c[3]*1.5);

  function updateBadge(){

  /* ---------------- 크기 변화 ---------------- */
  var rTimer = null;

  /* ================= 사운드 · 진동 · 마이크 =================

     다른 단계로 넘어가거나 화면을 벗어나면 재생·녹음·마이크 스트림을 즉시 정리한다. */
  var hwLayer     = document.getElementById("hwLayer");

  var spkStatusEl = document.getElementById("spkStatus");
  var vibBtn      = document.getElementById("vibBtn");
  var vibStatusEl = document.getElementById("vibStatus");

  var micDbEl     = document.getElementById("micDb");

  var SPK_IDLE = "버튼을 누르면 3음이 약 1.2초 재생됩니다";
  var VIB_IDLE = "갤럭시: 세 번 울립니다";
  var MIC_IDLE = "레벨 바가 움직이면 마이크 정상";

  function setSt(el, text, warn){

    return /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1;  /* iPadOS 13+ */
  }

  /* ---------- ① 스피커 (Web Audio · StereoPanner) ---------- */
  var actx = null, toneStopTimer = null, toneBtn = null, toneOscs = [];

  function audioCtxGet(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try{
      if (!actx) actx = new AC();
      if (actx.state === "suspended" && actx.resume) actx.resume();
      return actx;
    }catch(e){ return null; }
  }

  /* pan: -1(좌) · 0(양쪽) · +1(우). StereoPanner가 없으면 채널 병합으로 같은 효과 */
  function connectPanned(ac, node, pan){
    if (ac.createStereoPanner){
      var p = ac.createStereoPanner();
      try{ p.pan.setValueAtTime(pan, ac.currentTime); }catch(e){ p.pan.value = pan; }
      node.connect(p);
      return p;
    }
    if (ac.createChannelMerger && ac.createGain){
      var a = (pan + 1) / 2;
      var merger = ac.createChannelMerger(2);
      var gL = ac.createGain(), gR = ac.createGain();
      gL.gain.value = Math.cos(a * Math.PI / 2);
      gR.gain.value = Math.sin(a * Math.PI / 2);
      node.connect(gL); gL.connect(merger, 0, 0);
      node.connect(gR); gR.connect(merger, 0, 1);
      return merger;
    }
    return node;
  }

  function stopTone(){
    if (toneStopTimer){ clearTimeout(toneStopTimer); toneStopTimer = null; }
    for (var i = 0; i < toneOscs.length; i++){
      try{ toneOscs[i].stop(); }catch(e){}
      try{ toneOscs[i].disconnect(); }catch(e){}
    }
    toneOscs = [];
    if (toneBtn){ toneBtn.classList.remove("on"); toneBtn = null; }
  }

  function playTone(pan, btn){
    var ac = audioCtxGet();
    if (!ac){ setSt(spkStatusEl, "이 브라우저에서는 소리 테스트를 지원하지 않아요", true); return; }
    stopTone();

    var freqs = [523.25, 659.25, 783.99];   /* C5 · E5 · G5 */
    var len = 0.32, gap = 0.07;             /* 총 약 1.2초 */
    var t0 = ac.currentTime + 0.04;
    toneOscs = [];

    for (var i = 0; i < freqs.length; i++){
      var st = t0 + i * (len + gap);
      var osc = ac.createOscillator();
      var g = ac.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freqs[i], st);
      /* 작은 스피커에서도 들리게 앞뒤로 부드럽게 여닫는 엔벨로프 */
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.30, st + 0.025);
      g.gain.exponentialRampToValueAtTime(0.0001, st + len);
      osc.connect(g);
      connectPanned(ac, g, pan).connect(ac.destination);
      osc.start(st);
      osc.stop(st + len + 0.03);
      toneOscs.push(osc);
    }

    toneBtn = btn;
    btn.classList.add("on");
    setSt(spkStatusEl, pan < 0 ? "좌(L) 채널 재생 중" : pan > 0 ? "우(R) 채널 재생 중" : "양쪽(L+R) 재생 중", false);
    toneStopTimer = setTimeout(function(){
      stopTone();
      setSt(spkStatusEl, SPK_IDLE, false);
    }, 1220);
  }

  /* ---------- ② 진동 ---------- */
  var vibTimer = null;

  function doVibrate(){
    if (vibTimer){ clearTimeout(vibTimer); vibTimer = null; }
    if (vibBtn) vibBtn.classList.remove("on");

    if (isIOS() || typeof navigator.vibrate !== "function"){
      setSt(vibStatusEl, "아이폰 웹에서는 진동 테스트가 제한돼요 (무음 스위치로 확인)", true);
      return;
    }
    var ok = false;
    try{ ok = navigator.vibrate([220, 100, 220, 100, 300]); }catch(e){ ok = false; }
    if (ok === false){
      setSt(vibStatusEl, "이 브라우저에서는 진동이 막혀 있어요 · 설정에서 진동 허용 확인", true);
      return;
    }
    if (vibBtn) vibBtn.classList.add("on");
    setSt(vibStatusEl, "진동 3회 울리는 중…", false);
    vibTimer = setTimeout(function(){
      if (vibBtn) vibBtn.classList.remove("on");
      setSt(vibStatusEl, VIB_IDLE, false);
      vibTimer = null;
    }, 950);
  }

  /* ---------- ③ 마이크 (레벨 미터 + 3초 녹음 후 자동 재생) ---------- */
  var micAudio = null;
  var mic = { state:"idle", stream:null, ctx:null, analyser:null, raf:0, rec:null,
              chunks:[], stopTimer:null, cdTimer:null, abort:false, url:null };

  /* iOS는 사용자 제스처 밖에서 시작한 audio.play()를 막는다.
     버튼 클릭(제스처) 때 미리 play()를 한 번 걸어 두면 3초 뒤 자동 재생이 열린다. */
  var SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

  function micAudioEl(){
    if (!micAudio){
      try{ micAudio = new Audio(); micAudio.preload = "auto"; }catch(e){ micAudio = null; }
    }
    return micAudio;
  }

  function setMeter(level){
    if (!meterFill) return;
    var v = Math.max(0, Math.min(1, level || 0));
    meterFill.style.width = (Math.round(v * 1000) / 10) + "%";
  }

  function micCleanup(){
    if (mic.raf){ cancelAnimationFrame(mic.raf); mic.raf = 0; }
    if (mic.stopTimer){ clearTimeout(mic.stopTimer); mic.stopTimer = null; }
    if (mic.cdTimer){ clearInterval(mic.cdTimer); mic.cdTimer = null; }
    if (mic.rec){
      var r = mic.rec; mic.rec = null;
      try{ r.onstop = null; r.ondataavailable = null; if (r.state !== "inactive") r.stop(); }catch(e){}
    }
    if (mic.stream){
      try{ mic.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      mic.stream = null;
    }
    mic.analyser = null;
    if (mic.ctx){ try{ mic.ctx.close(); }catch(e){} mic.ctx = null; }
    mic.chunks = [];
    setMeter(0);
    if (micDbEl) micDbEl.textContent = "—";
  }

  function stopMicPlay(revoke){
    var au = micAudio;
    if (au){
      try{ au.onended = null; }catch(e){}
      try{ au.pause(); }catch(e){}
    }
    if (revoke && mic.url){ try{ URL.revokeObjectURL(mic.url); }catch(e){} }
    mic.url = null;
    if (mic.state === "play") mic.state = "idle";
  }

  function resetMicUI(msg, warn){
    if (micBtn) micBtn.classList.remove("on");
    if (micBtnLabel) micBtnLabel.textContent = "마이크 3초 녹음·재생";
    if (micBtnSub) micBtnSub.textContent = "눌러서 권한 허용";
    setMeter(0);
    if (micDbEl) micDbEl.textContent = "—";
    setSt(micStatusEl, msg || MIC_IDLE, warn);
  }

  function micErrorText(err){
    var n = (err && err.name) || "";
    if (n === "NotAllowedError" || n === "SecurityError" || n === "PermissionDeniedError")
      return "마이크 권한이 꺼져 있어요 · 허용 후 다시 눌러 주세요";
    if (n === "NotFoundError" || n === "DevicesNotFoundError") return "마이크를 찾을 수 없어요";
    if (n === "NotReadableError" || n === "TrackStartError") return "다른 앱이 마이크를 쓰고 있어요 · 통화·녹음 앱을 닫아 주세요";
    return "마이크를 열지 못했어요 · 권한을 확인해 주세요";
  }

  function startMeter(stream){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try{
      var ac = new AC();
      mic.ctx = ac;
      var src = ac.createMediaStreamSource(stream);
      var an = ac.createAnalyser();
      an.fftSize = 1024;
      an.smoothingTimeConstant = 0.55;
      src.connect(an);
      mic.analyser = an;
      var buf = new Uint8Array(an.fftSize);
      var tick = function(){
        if (mic.analyser !== an){ setMeter(0); return; }
        an.getByteTimeDomainData(buf);
        var sum = 0;
        for (var i = 0; i < buf.length; i++){
          var v = (buf[i] - 128) / 128;
          sum += v * v;
        }
        var rms = Math.sqrt(sum / buf.length);
        setMeter(Math.pow(rms, 0.6) * 1.9);
        if (micDbEl) micDbEl.textContent = rms > 0.0008 ? Math.round(20 * Math.log10(rms)) + " dB" : "무음";
        mic.raf = requestAnimationFrame(tick);
      };
      mic.raf = requestAnimationFrame(tick);
    }catch(e){}
  }

  function updateRecCountdown(t0){
    var left = Math.max(0, MIC_SEC - (Date.now() - t0) / 1000);
    setSt(micStatusEl, "● 녹음 중 · " + Math.max(1, Math.ceil(left)) + "초 남음", false);
  }

  function stopRecorder(){
    if (mic.stopTimer){ clearTimeout(mic.stopTimer); mic.stopTimer = null; }
    if (mic.cdTimer){ clearInterval(mic.cdTimer); mic.cdTimer = null; }
    var r = mic.rec;
    if (!r) return;
    try{ if (r.state !== "inactive") r.stop(); }catch(e){}
  }

  function finishRecording(mime){
    var chunks = mic.chunks;
    var aborted = mic.abort;
    mic.abort = false;
    mic.chunks = [];
    mic.rec = null;
    micCleanup();

    if (aborted){ mic.state = "idle"; resetMicUI(MIC_IDLE, false); return; }

    var blob = null;
    try{ blob = new Blob(chunks, { type: mime || "audio/webm" }); }catch(e){ blob = null; }
    if (!blob || !blob.size){
      mic.state = "idle";
      resetMicUI("녹음된 소리가 없어요 · 다시 눌러 주세요", true);
      return;
    }

    var au = micAudioEl();
    if (!au){
      mic.state = "idle";
      resetMicUI("이 브라우저에서는 녹음 재생을 지원하지 않아요", true);
      return;
    }

    try{ mic.url = URL.createObjectURL(blob); }catch(e){ mic.url = null; }
    if (!mic.url){
      mic.state = "idle";
      resetMicUI("녹음 파일을 만들지 못했어요 · 다시 눌러 주세요", true);
      return;
    }

    mic.state = "play";
    if (micBtn) micBtn.classList.remove("on");
    if (micBtnLabel) micBtnLabel.textContent = "다시 녹음";
    if (micBtnSub) micBtnSub.textContent = "누르면 새로 3초 녹음";
    setSt(micStatusEl, "녹음 재생 중 · 소리가 들리는지 확인", false);

    try{ au.onended = null; }catch(e){}
    au.onended = function(){
      mic.state = "idle";
      stopMicPlay(true);
      resetMicUI("재생 끝 · 다시 눌러 반복", false);
    };
    try{ au.src = mic.url; }catch(e){}

    var pr = null;
    try{ pr = au.play(); }catch(e){ pr = null; }
    if (pr && pr.then){
      pr["catch"](function(){
        mic.state = "idle";
        setSt(micStatusEl, "자동 재생이 막혔어요 · 버튼을 다시 눌러 주세요", true);
      });
    }
  }

  function startRecorder(stream){
    var MR = window.MediaRecorder;
    var mime = "";
    if (MR && typeof MR.isTypeSupported === "function"){
      var types = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"];
      for (var i = 0; i < types.length; i++){
        if (MR.isTypeSupported(types[i])){ mime = types[i]; break; }
      }
    }

    var rec = null;
    if (MR){
      try{ rec = mime ? new MR(stream, { mimeType:mime }) : new MR(stream); }catch(e){ rec = null; }
    }

    /* 녹음 미지원: 3초 동안 레벨 미터만 보여 주고 끝낸다 */
    if (!rec){
      mic.state = "rec";
      if (micBtn) micBtn.classList.add("on");
      if (micBtnLabel) micBtnLabel.textContent = "레벨 확인 중…";
      if (micBtnSub) micBtnSub.textContent = "3초 뒤 자동 종료";
      setSt(micStatusEl, "이 브라우저는 녹음을 지원하지 않아요 · 레벨 바로 확인", true);
      mic.stopTimer = setTimeout(function(){
        mic.state = "idle";
        micCleanup();
        resetMicUI("레벨 확인 끝 · 다시 눌러 반복", false);
      }, MIC_SEC * 1000);
      return;
    }

    mic.rec = rec;
    mic.chunks = [];
    mic.state = "rec";
    rec.ondataavailable = function(ev){ if (ev.data && ev.data.size) mic.chunks.push(ev.data); };
    rec.onstop = function(){ finishRecording(mime); };

    if (micBtn) micBtn.classList.add("on");
    if (micBtnLabel) micBtnLabel.textContent = "녹음 중지";
    if (micBtnSub) micBtnSub.textContent = "다시 누르면 중단";

    var startedAt = Date.now();
    updateRecCountdown(startedAt);
    mic.cdTimer = setInterval(function(){ updateRecCountdown(startedAt); }, 200);
    mic.stopTimer = setTimeout(stopRecorder, MIC_SEC * 1000);

    try{ rec.start(); }
    catch(e){
      mic.rec = null;
      mic.state = "idle";
      micCleanup();
      resetMicUI("녹음을 시작하지 못했어요 · 다시 눌러 주세요", true);
    }
  }

  function onMicBtn(){
    if (mic.state === "starting" || mic.state === "rec"){
      mic.state = "idle";
      micCleanup();
      resetMicUI("중단했어요 · 다시 누르면 3초 녹음", false);
      return;
    }

    if (!(location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
      setSt(micStatusEl, "HTTPS 주소에서만 마이크를 쓸 수 있어요", true);
      return;
    }
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      setSt(micStatusEl, "이 브라우저는 마이크 입력을 지원하지 않아요", true);
      return;
    }

    stopMicPlay(true);
    micCleanup();
    mic.abort = false;
    mic.state = "starting";

    /* iOS 자동 재생 허용: 이 클릭(제스처) 안에서 오디오 요소를 한 번 열어 둔다 */
    var au = micAudioEl();
    if (au){
      try{
        au.src = SILENT_WAV;
        var pp = au.play();
        if (pp && pp["catch"]) pp["catch"](function(){});
      }catch(e){}
    }

    if (micBtn) micBtn.classList.add("on");
    if (micBtnLabel) micBtnLabel.textContent = "마이크 여는 중…";
    if (micBtnSub) micBtnSub.textContent = "권한 창이 뜨면 허용";
    setSt(micStatusEl, "마이크 권한을 허용해 주세요", false);

    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      if (mic.state !== "starting"){
        try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
        return;
      }
      mic.stream = stream;
      startMeter(stream);
      startRecorder(stream);
    })["catch"](function(err){
      if (mic.state !== "starting") return;
      mic.state = "idle";
      micCleanup();
      resetMicUI(micErrorText(err), true);
    });
  }

  /* 이 화면을 떠날 때: 재생·녹음·마이크 스트림을 모두 내린다 */
  function hwStopAll(){
    stopTone();
    setSt(spkStatusEl, SPK_IDLE, false);
    if (vibTimer){ clearTimeout(vibTimer); vibTimer = null; }
    if (vibBtn) vibBtn.classList.remove("on");
    setSt(vibStatusEl, VIB_IDLE, false);
    mic.abort = true;
    stopRecorder();
    stopMicPlay(true);
    micCleanup();
    mic.state = "idle";
    resetMicUI(MIC_IDLE, false);
  }

  if (hwLayer){
    Array.prototype.forEach.call(spkBtns, function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        playTone(parseFloat(b.getAttribute("data-pan")) || 0, b);
      });
    });
    if (vibBtn) vibBtn.addEventListener("click", function(e){ e.stopPropagation(); doVibrate(); });
    if (micBtn) micBtn.addEventListener("click", function(e){ e.stopPropagation(); onMicBtn(); });
  }

  /* ---------------- 브라우저별 안내 ---------------- */
  /* 삼성 인터넷은 '웹 콘텐츠에 어두운 화면 모드 강제 적용'이 켜져 있으면 페이지 색을 반전시킨다.
     color-scheme: light only로 막을 수 있는 버전도 있지만 아닌 버전이 있어 설정 경로를 함께 보여 준다. */
  var browserTip = document.getElementById("browserTip");
  if (browserTip && /SamsungBrowser/i.test(navigator.userAgent)){
    browserTip.innerHTML =
      "<b>삼성 인터넷에서 흰색이 어둡게 보이면</b><br>" +
      "설정 → 웹페이지 보기 및 스크롤 방식 → 어두운 화면 모드 → ‘웹 콘텐츠에 어두운 화면 모드 강제 적용’ 끄기 (또는 크롬으로 열기)";
    browserTip.hidden = false;
  }

  /* ---------------- 시작 ---------------- */
  buildChips();
  syncFsBtn();
  render();
})();
</script>
</body>
